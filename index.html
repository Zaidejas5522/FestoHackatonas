<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IdeaFlow | Automation Ideas</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ── LOGIN VIEW ──────────────────────────────────── -->
<div id="login-view" class="auth-view">
  <div class="auth-glow auth-glow--green"></div>
  <div class="auth-glow auth-glow--purple"></div>

  <div class="auth-box">
    <div class="auth-logo">idea<span>flow</span></div>
    <div class="auth-tagline">Welcome back — sign in to continue</div>

    <div class="field-group">
      <label>Email</label>
      <input type="text" id="login-email" placeholder="you@company.com" autocomplete="email">
    </div>

    <div class="field-group">
      <label>Password</label>
      <div class="password-wrap">
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
        <button class="toggle-pw" onclick="togglePassword('login-password', this)" tabindex="-1" type="button">show</button>
      </div>
    </div>

    <button class="btn btn-primary" id="login-btn" onclick="handleLogin()">Sign In</button>

    <div id="login-status" class="auth-status"></div>

    <div class="auth-switch">
      No account? <a href="#" onclick="showView('register-view')">Create one</a>
    </div>
  </div>
</div>

<!-- ── REGISTER VIEW ───────────────────────────────── -->
<div id="register-view" class="auth-view" style="display:none;">
  <div class="auth-glow auth-glow--green"></div>
  <div class="auth-glow auth-glow--purple"></div>

  <div class="auth-box">
    <div class="auth-logo">idea<span>flow</span></div>
    <div class="auth-tagline">Create your account to get started</div>

    <div class="field-group">
      <label>Full Name</label>
      <input type="text" id="reg-name" placeholder="Your name" autocomplete="name">
    </div>

    <div class="field-group">
      <label>Email</label>
      <input type="text" id="reg-email" placeholder="you@company.com" autocomplete="email">
    </div>

    <div class="field-group">
      <label>Password</label>
      <div class="password-wrap">
        <input type="password" id="reg-password" placeholder="At least 6 characters" autocomplete="new-password">
        <button class="toggle-pw" onclick="togglePassword('reg-password', this)" tabindex="-1" type="button">show</button>
      </div>
    </div>

    <div class="field-group">
      <label>Confirm Password</label>
      <div class="password-wrap">
        <input type="password" id="reg-password2" placeholder="Repeat password" autocomplete="new-password">
        <button class="toggle-pw" onclick="togglePassword('reg-password2', this)" tabindex="-1" type="button">show</button>
      </div>
    </div>

    <button class="btn btn-primary" id="register-btn" onclick="handleRegister()">Create Account</button>

    <div id="register-status" class="auth-status"></div>

    <div class="auth-switch">
      Already have an account? <a href="#" onclick="showView('login-view')">Sign in</a>
    </div>
  </div>
</div>

<!-- ── DASHBOARD VIEW ──────────────────────────────── -->
<div id="dashboard-view" style="display:none; min-height:100vh;">
  <div class="topbar">
    <div class="topbar-logo">idea<span>flow</span></div>
    <div class="topbar-right">
      <div class="topbar-user">signed in as <strong id="user-display"></strong></div>
      <button class="btn-logout" onclick="handleLogout()">Sign out</button>
    </div>
  </div>
  <div class="dashboard-body">
    <div class="controls">
      <input type="text" id="search" placeholder="Search ideas or author…" oninput="renderIdeas()">
      <select id="status-filter" onchange="renderIdeas()">
        <option value="All">All Status</option>
        <option value="Pending">Pending</option>
        <option value="Approved">Approved</option>
        <option value="Rejected">Rejected</option>
      </select>
      <button class="btn btn-new btn-sm" onclick="openForm()">+ New Idea</button>
    </div>
    <div class="ideas-grid" id="ideas-grid"></div>
  </div>
</div>

<!-- ── DETAIL VIEW ─────────────────────────────────── -->
<div id="detail-view" style="display:none; min-height:100vh;">
  <div class="detail-topbar">
    <button class="btn btn-back btn-sm" onclick="showDashboard()">← Back</button>
    <div style="font-size:12px;color:var(--muted);letter-spacing:.06em;">AUTOMATION IDEA DETAIL</div>
  </div>
  <div class="detail-body" id="detail-body"></div>
</div>

<!-- ── MODAL ───────────────────────────────────────── -->
<div id="modal-overlay">
  <div class="modal-box">
    <div class="modal-title">New Automation Idea</div>

    <div class="modal-section-label">§1 — Basic Info</div>
    <label>Your Name / Author</label>
    <input type="text" id="f-author" placeholder="Full name">
    <label>Automation Name</label>
    <input type="text" id="f-name" placeholder="Short descriptive title">
    <label>Description</label>
    <textarea id="f-desc" placeholder="Describe the process to automate…"></textarea>

    <div class="modal-section-label">§2 — Complexity</div>
    <label>Standardized Process Score (0–10)</label>
    <div class="range-wrapper">
      <input type="range" id="f-std" min="0" max="10" value="5" oninput="document.getElementById('f-std-val').innerText=this.value">
      <span class="range-val" id="f-std-val">5</span>
    </div>
    <label>Digital Input?</label>
    <select id="f-digital">
      <option value="">Select…</option>
      <option>Yes</option><option>No</option><option>Maybe</option>
    </select>
    <label>Rule-Based?</label>
    <select id="f-rule">
      <option value="">Select…</option>
      <option>Yes</option><option>No</option><option>Maybe</option>
    </select>
    <label>Software Systems Involved</label>
    <select id="f-systems">
      <option value="">Select…</option>
      <option value="1 or less">1 or less</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4 or more">4 or more</option>
    </select>

    <div class="modal-section-label">§3 — Impact</div>
    <label>Weekly Hours Saved (estimate)</label>
    <input type="number" id="f-hours" placeholder="e.g. 4.5" min="0" step="0.5">
    <label>Speed Criticality (0–10)</label>
    <div class="range-wrapper">
      <input type="range" id="f-speed" min="0" max="10" value="5" oninput="document.getElementById('f-speed-val').innerText=this.value">
      <span class="range-val" id="f-speed-val">5</span>
    </div>

    <div class="modal-section-label">§4 — Implementation</div>
    <label>Test Data Available?</label>
    <select id="f-testdata">
      <option value="">Select…</option>
      <option>Yes</option><option>No</option>
    </select>
    <label>Process Documented?</label>
    <select id="f-documented">
      <option value="">Select…</option>
      <option>Yes</option><option>No</option>
    </select>

    <div class="modal-actions">
      <button class="btn btn-cancel btn-sm" onclick="closeForm()">Cancel</button>
      <button class="btn btn-submit btn-sm" onclick="submitIdea()">Submit Idea</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
